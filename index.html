<!DOCTYPE html>
<html lang="id" data-mode="desktop">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#d32f2f">
  <meta name="color-scheme" content="light dark">
  <title>PIN Trainer</title>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/mobile.css">
  <link rel="stylesheet" href="css/desktop.css">

  <!-- Dijalankan sinkron: menentukan mode (mobile / desktop) sebelum halaman digambar -->
  <script src="js/mode.js"></script>
</head>
<body>

  <header class="topbar">
    <h1>PIN Trainer</h1>
    <button type="button" class="link-btn" id="clearHistory">Hapus riwayat</button>
  </header>

  <main class="app">

    <!-- Riwayat: yang terbaru ada di paling bawah, tepat di atas angka -->
    <section class="history" id="history" aria-label="Riwayat PIN">
      <p class="history-empty" id="historyEmpty">Belum ada riwayat. Mulai ketik 6 angka.</p>
      <ol id="historyList"></ol>
    </section>

    <!-- PIN yang sedang diketik + timer -->
    <section class="display" aria-label="PIN yang sedang diketik">
      <div class="slots" id="slots" aria-hidden="true">
        <span class="slot"></span><span class="slot"></span><span class="slot"></span>
        <span class="slot"></span><span class="slot"></span><span class="slot"></span>
      </div>
      <div class="timer is-idle" id="timer" role="timer" aria-live="off">
        <span class="timer-value" id="timerValue">0.000</span>
        <span class="timer-unit" id="timerUnit">detik</span>
      </div>
    </section>

    <!-- MODE MOBILE: numpad sentuh -->
    <section class="pad pad--mobile" id="padMobile" aria-label="Numpad">
      <button type="button" class="mkey" data-key="1">1</button>
      <button type="button" class="mkey" data-key="2">2</button>
      <button type="button" class="mkey" data-key="3">3</button>

      <button type="button" class="mkey" data-key="4">4</button>
      <button type="button" class="mkey" data-key="5">5</button>
      <button type="button" class="mkey" data-key="6">6</button>

      <button type="button" class="mkey k3" data-key="7">7</button>
      <button type="button" class="mkey k3" data-key="8">8</button>
      <button type="button" class="mkey k3" data-key="9">9</button>
      <button type="button" class="mkey k3" data-key="0">0</button>

      <button type="button" class="mkey k6 mkey--enter" data-key="enter" aria-label="Enter, simpan PIN">Enter</button>
      <button type="button" class="mkey k6 mkey--reset" data-key="reset" aria-label="Reset">Reset</button>
    </section>

    <!-- MODE DESKTOP: tampilan deretan angka seperti keyboard (input dari keyboard fisik) -->
    <section class="pad pad--desktop" id="padDesktop" aria-hidden="true">
      <div class="dkey" data-key="1">1</div>
      <div class="dkey" data-key="2">2</div>
      <div class="dkey" data-key="3">3</div>
      <div class="dkey" data-key="4">4</div>
      <div class="dkey" data-key="5">5</div>
      <div class="dkey" data-key="6">6</div>
      <div class="dkey" data-key="7">7</div>
      <div class="dkey" data-key="8">8</div>
      <div class="dkey" data-key="9">9</div>
      <div class="dkey" data-key="0">0</div>
    </section>

    <p class="hint">
      Ketik angka dengan keyboard &middot; <kbd>Enter</kbd> simpan &middot; <kbd>Esc</kbd> / <kbd>Backspace</kbd> reset
    </p>
  </main>

  <noscript>PIN Trainer membutuhkan JavaScript.</noscript>

  <script src="js/app.js"></script>
  <script src="js/mobile.js"></script>
  <script src="js/desktop.js"></script>
</body>
</html>
